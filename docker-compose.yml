services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-difol}
      MYSQL_USER: ${DB_USER:-difol}
      MYSQL_PASSWORD: ${DB_PASSWORD:-difol}
      TZ: ${TZ:-America/El_Salvador}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-difol}
      DB_PASSWORD: ${DB_PASSWORD:-difol}
      DB_NAME: ${DB_NAME:-difol}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      TZ: ${TZ:-America/El_Salvador}
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./database:/app/database:ro
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
