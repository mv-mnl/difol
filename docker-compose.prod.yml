services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-difol}
      MYSQL_USER: ${DB_USER:-difol}
      MYSQL_PASSWORD: ${DB_PASSWORD:-difol}
      TZ: ${TZ:-America/El_Salvador}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: difol-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-difol}
      DB_PASSWORD: ${DB_PASSWORD:-difol}
      DB_NAME: ${DB_NAME:-difol}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio en produccion}
      TZ: ${TZ:-America/El_Salvador}
    volumes:
      - ./database:/app/database:ro
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: difol-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend

  # Todo el trafico entra por el tunnel de Cloudflare, no hay puertos publicados
  # al host: ni backend ni frontend son alcanzables salvo a traves de este tunel
  # (el hostname publico se mapea a http://frontend:80 desde el dashboard de
  # Cloudflare Zero Trust; nginx en el frontend ya proxea /api/ al backend, asi
  # que un solo hostname alcanza para toda la app).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN es obligatorio} --protocol http2
    depends_on:
      - frontend

volumes:
  mysql_data:
